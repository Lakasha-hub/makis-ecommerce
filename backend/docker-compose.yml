services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: makis_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MONGO_URI=mongodb://root:password@mongodb:27017/makis?authSource=admin
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    command: npm run dev
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    container_name: makis_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
